- name: Create Tools Directory in not exist
  include_tasks: subplaybooks/create_docker_containers_dir.yaml

- name: Create nessus directory
  file:
    path: "{{ docker_containers_directory }}/nessus"
    state: directory
    owner: "{{ kali_username }}"
    group: "{{ kali_username }}"

- name: Create nessus variables file
  when:
    - nessus.activation_code is defined
    - nessus.activation_code != 'XXXX-XXXX-XXXX-XXXX'
  lineinfile:
    mode: 660
    path: "{{ docker_containers_directory }}/nessus/variables.env"
    create: yes
    state: present
    regexp: ^ACTIVATION_CODE
    line: ACTIVATION_CODE={{ nessus.activation_code }}

- name: Create nessus variables file
  when: nessus.username is defined
  lineinfile:
    mode: 660
    path: "{{ docker_containers_directory }}/nessus/variables.env"
    create: yes
    state: present
    regexp: ^USERNAME
    line: USERNAME={{ nessus.username }}

- name: Create nessus variables file
  when: nessus.password is defined
  lineinfile:
    mode: 660
    path: "{{ docker_containers_directory }}/nessus/variables.env"
    create: yes
    state: present
    regexp: ^PASSWORD
    line: PASSWORD={{ nessus.password }}

- name: Create nessus directory
  file:
    path: "{{ docker_containers_directory }}/nessus/variables.env"
    state: touch

- name: Create docker-compose file
  copy:
    dest: "{{ docker_containers_directory }}/nessus/docker-compose.yaml"
    owner: "{{ kali_username }}"
    group: "{{ kali_username }}"
    content: |
      services:
        nessus:
          container_name: nessus
          image: tenable/nessus:latest-ubuntu
          env_file:
            - variables.env
          entrypoint: tail -f /dev/null

- name: Build nessus container
  community.docker.docker_compose_v2:
    project_src: "{{ docker_containers_directory }}/nessus"
    pull: always
    build: always
    recreate: always

- name: Execute docker cp command
  shell: docker cp -a nessus:/opt {{ docker_containers_directory }}/nessus

- name: Down nessus container
  community.docker.docker_compose_v2:
    project_src: "{{ docker_containers_directory }}/nessus"
    state: absent

- name: Update docker-compose file
  copy:
    dest: "{{ docker_containers_directory }}/nessus/docker-compose.yaml"
    owner: "{{ kali_username }}"
    group: "{{ kali_username }}"
    content: |
      services:
        nessus:
          container_name: nessus
          image: tenable/nessus:latest-ubuntu
          ports:
            - "8834:8834"
          env_file:
            - variables.env
          volumes:
            - ./opt:/opt